name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bun install --frozen-lockfile
      - run: ./scripts/fetch-media.sh
      - run: bunx expo prebuild --platform android --clean
      # Expo's release build signs with android/app/debug.keystore. Android only installs an
      # update over an app signed with the same key, so the key lives in the ANDROID_KEYSTORE
      # secret (base64). No secret = no build, rather than an APK that can't update the last one.
      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          [ -n "$ANDROID_KEYSTORE" ] || { echo "::error::Set the ANDROID_KEYSTORE secret (see README)"; exit 1; }
          echo "$ANDROID_KEYSTORE" | base64 -d > android/app/debug.keystore
      - name: Build
        run: cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk Ethos.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ethos.apk
          path: Ethos.apk
